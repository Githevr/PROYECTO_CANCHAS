<section class="canchas-section">

  <div class="container">

    <!-- HEADER -->
    <div class="section-header">

      <div>

        <span class="section-subtitle">
          CANCHAS DESTACADAS
        </span>

        <h2>
          Las mejores canchas para ti
        </h2>

      </div>

      <a class="view-all">
        Ver todas →
      </a>

    </div>

    <!-- GRID -->
    <div class="canchas-grid">

      <div
        class="cancha-card"
        *ngFor="let cancha of canchas"
        [routerLink]="['/reservar']"
        [queryParams]="{ canchaId: cancha.id }"
        style="cursor: pointer;">

        <!-- IMAGE -->
        <div class="card-image">

          <img
            [src]="obtenerImagenUrl(cancha.imagen)"
            [alt]="cancha.nombre">

          <button class="favorite-btn">

            <svg
              class="favorite-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
              fill="currentColor">

              <path d="M442.9 144C415.6 144 389.9 157.1 373.9 179.2L339.5 226.8C335 233 327.8 236.7 320.1 236.7C312.4 236.7 305.2 233 300.7 226.8L266.3 179.2C250.3 157.1 224.6 144 197.3 144C150.3 144 112.2 182.1 112.2 229.1C112.2 279 144.2 327.5 180.3 371.4C221.4 421.4 271.7 465.4 306.2 491.7C309.4 494.1 314.1 495.9 320.2 495.9C326.3 495.9 331 494.1 334.2 491.7C368.7 465.4 419 421.3 460.1 371.4C496.3 327.5 528.2 279 528.2 229.1C528.2 182.1 490.1 144 443.1 144zM335 151.1C360 116.5 400.2 96 442.9 96C516.4 96 576 155.6 576 229.1C576 297.7 533.1 358 496.9 401.9C452.8 455.5 399.6 502 363.1 529.8C350.8 539.2 335.6 543.9 320 543.9C304.4 543.9 289.2 539.2 276.9 529.8C240.4 502 187.2 455.5 143.1 402C106.9 358.1 64 297.7 64 229.1C64 155.6 123.6 96 197.1 96C239.8 96 280 116.5 305 151.1L320 171.8L335 151.1z"/>

            </svg>

          </button>

          <span class="badge-card">

            Más reservada

          </span>

        </div>

        <!-- CONTENT -->
        <div class="card-content">

            <!-- TOP -->
            <div class="card-top">

              <h3>
                {{ cancha.nombre }}
              </h3>

              <span class="rating">

                ⭐ {{ cancha.rating }}

              </span>

            </div>

            <!-- DETAILS -->
            <div class="card-details">

              <!-- LOCATION -->
              <p class="location">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 640 640"
                  class="sec-ub-svg-icon"
                  fill="currentColor">
                  <path d="M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z"/>
                </svg>
                <span>{{ cancha.ubicacion }}</span>
              </p>

              <!-- FEATURES (Pills) -->
              <div class="card-features">
                <span class="feature-pill">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"
                    class="feature-svg-icon"
                    fill="currentColor">
                    <path d="M481.3 424.1L409.7 419.3C404.5 419 399.4 420.4 395.2 423.5C391 426.6 388 430.9 386.8 436L369.2 505.6C353.5 509.8 337 512 320 512C303 512 286.5 509.8 270.8 505.6L253.2 436C251.9 431 248.9 426.6 244.8 423.5C240.7 420.4 235.5 419 230.3 419.3L158.7 424.1C141.1 396.9 130.2 364.9 128.3 330.5L189 292.3C193.4 289.5 196.6 285.3 198.2 280.4C199.8 275.5 199.6 270.2 197.7 265.4L171 198.8C192 173.2 219.3 153 250.7 140.9L305.9 186.9C309.9 190.2 314.9 192 320 192C325.1 192 330.2 190.2 334.1 186.9L389.3 140.9C420.6 153 448 173.2 468.9 198.8L442.2 265.4C440.3 270.2 440.1 275.5 441.7 280.4C443.3 285.3 446.6 289.5 450.9 292.3L511.6 330.5C509.7 364.9 498.8 396.9 481.2 424.1zM320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM334.1 250.3C325.7 244.2 314.3 244.2 305.9 250.3L258 285C249.6 291.1 246.1 301.9 249.3 311.8L267.6 368.1C270.8 378 280 384.7 290.4 384.7L349.6 384.7C360 384.7 369.2 378 372.4 368.1L390.7 311.8C393.9 301.9 390.4 291.1 382 285L334.1 250.2z"/>
                  </svg>
                  <span>{{ cancha.tipo }}</span>
                </span>
                <span class="feature-pill">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"
                    class="feature-svg-icon"
                    fill="currentColor">
                    <path d="M576 96C576 204.1 499.4 294.3 397.6 315.4C389.7 257.3 363.6 205 325.1 164.5C365.2 104 433.9 64 512 64L544 64C561.7 64 576 78.3 576 96zM64 160C64 142.3 78.3 128 96 128L128 128C251.7 128 352 228.3 352 352L352 544C352 561.7 337.7 576 320 576C302.3 576 288 561.7 288 544L288 384C164.3 384 64 283.7 64 160z"/>
                  </svg>
                  <span>Grass sintético</span>
                </span>
              </div>

              <!-- DIVIDER -->
              <div class="card-divider"></div>

              <!-- FOOTER PRICE -->
              <div class="card-footer-price">
                <span class="price-label">Precio por hora</span>
                <div class="price-value-wrapper">
                  <small class="price-prefix">desde</small>
                  <span class="price-amount">S/{{ cancha.precio }}</span>
                  <span class="price-unit">/h</span>
                </div>
              </div>

            </div>
          </div>
      </div>
    </div>
  </div>

</section>
