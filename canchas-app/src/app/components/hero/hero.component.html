

<section class="hero-section">

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- CONTENT -->
  <div class="container hero-content">

    <span class="subtitle">
      SISTEMA DE RESERVAS
    </span>

    <h1>
      Reserva tu cancha <br>
      al instante
    </h1>

    <p>
      Encuentra, reserva y juega
      en las mejores canchas deportivas
      de tu ciudad.
    </p>

    <!-- FEATURES -->
    <div class="hero-features">

    <!-- RESERVA RAPIDA -->
    <div class="feature-item">

        <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 640 640"
        class="feature-icon">

        </svg>

        <span>Reserva rápida</span>

    </div>

    <!-- MEJORES PRECIOS -->

        <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 640 640"
        class="feature-icon">

        </svg>

        <span>Mejores precios</span>

    </div>

    <!-- PAGO SEGURO -->
    <div class="feature-item">

        <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 640 640"
        class="feature-icon">

        <path d="M256 160L256 224L384 224L384 160C384 124.7 355.3 96 320 96C284.7 96 256 124.7 256 160zM192 224L192 160C192 89.3 249.3 32 320 32C390.7 32 448 89.3 448 160L448 224C483.3 224 512 252.7 512 288L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 288C128 252.7 156.7 224 192 224z"/>

        </svg>

        <span>Pago seguro</span>

    </div>

    </div>

    <!-- SEARCH BOX -->
    <div class="search-banner">

    <!-- UBICACION -->
    <div class="search-item">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            class="search-svg-icon">

            <path d="M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z"/>

        </svg>

        <a [href]="mapUrl" target="_blank" class="search-item" style="text-decoration: none; color: inherit; cursor: pointer;">
            <div>
                <span class="search-label">Ubicación</span>
                <p>{{ nombreUbicacion }}</p>
            </div>
        </a>

    </div>

    <!-- DEPORTE -->
    <div class="search-item">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            class="search-svg-icon">

            <path d="M481.3 424.1L409.7 419.3C404.5 419 399.4 420.4 395.2 423.5C391 426.6 388 430.9 386.8 436L369.2 505.6C353.5 509.8 337 512 320 512C303 512 286.5 509.8 270.8 505.6L253.2 436C251.9 431 248.9 426.6 244.8 423.5C240.7 420.4 235.5 419 230.3 419.3L158.7 424.1C141.1 396.9 130.2 364.9 128.3 330.5L189 292.3C193.4 289.5 196.6 285.3 198.2 280.4C199.8 275.5 199.6 270.2 197.7 265.4L171 198.8C192 173.2 219.3 153 250.7 140.9L305.9 186.9C309.9 190.2 314.9 192 320 192C325.1 192 330.2 190.2 334.1 186.9L389.3 140.9C420.6 153 448 173.2 468.9 198.8L442.2 265.4C440.3 270.2 440.1 275.5 441.7 280.4C443.3 285.3 446.6 289.5 450.9 292.3L511.6 330.5C509.7 364.9 498.8 396.9 481.2 424.1zM320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM334.1 250.3C325.7 244.2 314.3 244.2 305.9 250.3L258 285C249.6 291.1 246.1 301.9 249.3 311.8L267.6 368.1C270.8 378 280 384.7 290.4 384.7L349.6 384.7C360 384.7 369.2 378 372.4 368.1L390.7 311.8C393.9 301.9 390.4 291.1 382 285L334.1 250.2z"/>

        </svg>

        <div class="search-item">
    <div>
        <span class="search-label">Deporte</span>
        <select class="form-select border-0 bg-transparent shadow-none px-0 fw-bold text-dark" [(ngModel)]="deporteSeleccionado" style="cursor: pointer;">
    @for (deporte of deportes; track deporte) {
        <option [value]="deporte">{{ deporte }}</option>
    }
</select>
    </div>
</div>

    </div>

    <!-- FECHA -->
    <div class="search-item">

        <div class="search-item">
            <app-date-picker [(fecha)]="fechaSeleccionada"></app-date-picker>
        </div>

    </div>

    <!-- HORA -->
    <div class="search-item">

        <div class="search-item">
            <app-time-picker [(hora)]="horaSeleccionada"></app-time-picker>
        </div>

    </div>

    <!-- BOTON -->
    <button class="search-btn" (click)="buscarCanchas()">
        Buscar canchas
    </button>

    </div>

  </div>

</section>
