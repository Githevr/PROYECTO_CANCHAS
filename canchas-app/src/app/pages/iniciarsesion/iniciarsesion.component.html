<app-navbar></app-navbar>

<div class="auth-container">

  <div class="auth-card">

    <!-- HEADER -->
    <div class="auth-header">
      <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
          <path d="M144 144v48H304V144c0-44.2-35.8-80-80-80s-80 35.8-80 80zM80 192V144C80 64.5 144.5 0 224 0s144 64.5 144 144v48h16c26.5 0 48 21.5 48 48V464c0 26.5-21.5 48-48 48H64c-26.5 0-48-21.5-48-48V240c0-26.5 21.5-48 48-48H80z"/>
        </svg>
      </div>
      <h2>Iniciar Sesión</h2>
      <p>Ingresa a tu cuenta para gestionar tus reservas</p>
    </div>

    <!-- MENSAJE -->
    <div
      *ngIf="mensaje"
      class="auth-mensaje"
      [class.auth-mensaje-error]="tipoMensaje === 'error'"
      [class.auth-mensaje-exito]="tipoMensaje === 'exito'">
      {{ mensaje }}
      <div *ngIf="requiereConfirmacion" class="mt-3">
        <button class="btn-confirmar-sh" (click)="irAConfirmacion()">Confirmar correo ahora</button>
      </div>
    </div>

    <!-- FORMULARIO -->
    <form (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="nombre@ejemplo.com"
          required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-password-wrapper">
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required>
          <button type="button" class="btn-toggle-password" (click)="toggleMostrarPassword()" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i [class]="mostrarPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-auth">
        Ingresar
      </button>

    </form>

    <!-- FOOTER -->
    <div class="auth-footer">
      <p>¿No tienes una cuenta? <a routerLink="/registrar">Regístrate aquí</a></p>
    </div>

  </div>

</div>
